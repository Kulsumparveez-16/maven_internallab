
name: Maven Build Test and Docker Push

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  # JOB 1: Build and Test using Maven
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and Run JUnit Tests
        run: mvn clean package

      - name: Upload Maven JAR
        uses: actions/upload-artifact@v4
        with:
          name: library-book-jar
          path: target/maven-internal-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

  # JOB 2: Build Docker Image and Push to Docker Hub
  docker-build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Download Maven JAR
        uses: actions/download-artifact@v4
        with:
          name: library-book-jar
          path: target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/library-book-management:latest
